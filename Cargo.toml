[package]
name = "diffloom"
version = "0.1.0"
edition = "2021"
description = "Workspace file timeline, snapshots, MCP, and optional LLM diff review for agentic workflows"
readme = "README.md"
license = "MIT"
repository = "https://github.com/diffloom/diffloom"
keywords = ["diff", "timeline", "mcp", "agents", "sqlite"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "diffloom"
path = "src/lib.rs"

[[bin]]
name = "diffloom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
eframe = { version = "0.34", default-features = false, features = ["default", "wayland", "x11", "glow"] }
crossterm = "0.29.0"
git2 = { version = "0.20.4", features = ["vendored-libgit2"] }
hex = "0.4.3"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
ratatui = "0.30.0"
rfd = "0.15"
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
similar = "2.7.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.23.0"
